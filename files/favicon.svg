<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MA">
    <!-- Monogram favicon in the site's paper/accent colours. A generic serif stack
         is used rather than Fraunces: a favicon is rendered outside the page, so it
         cannot reach the self-hosted @font-face files. The solid paper-coloured
         plate keeps the mark legible against both light and dark browser chrome. -->
    <rect width="64" height="64" rx="10" fill="#edf6e9" />
    <rect x="1.5" y="1.5" width="61" height="61" rx="8.5" fill="none" stroke="#35524a" stroke-opacity="0.35"
        stroke-width="3" />
    <text x="32" y="33" fill="#35524a" font-family="Georgia, 'Times New Roman', serif" font-size="31"
        font-weight="600" letter-spacing="-1.5" text-anchor="middle" dominant-baseline="central">MA</text>
</svg>
