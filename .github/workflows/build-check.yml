name: Build check

# index.html and sitemap.xml are generated from news.json, experience.json and
# publications.json by build.js (see that file's header comment), and cv.pdf is
# copied from whatever the CV icon in index.html links to. This job re-runs the
# generator and fails if the result differs from what's committed, which is what
# catches "edited the JSON / changed the CV link, forgot to run node build.js".
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node build.js

      - name: Fail if generated files are out of date
        # git status rather than git diff, so a cv.pdf that was never committed
        # (untracked after the build) also fails the check.
        run: |
          if [ -n "$(git status --porcelain -- index.html sitemap.xml cv.pdf)" ]; then
            echo "::error::index.html, sitemap.xml and/or cv.pdf are out of date. Run 'node build.js' and commit the result."
            git status --short -- index.html sitemap.xml cv.pdf
            git diff -- index.html sitemap.xml
            exit 1
          fi
